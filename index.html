<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nisse Lindberg | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Miranda:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom Scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f4f4f5; /* Zinc-100 */
      }
      .dark ::-webkit-scrollbar-track {
        background: #09090b; /* Zinc-950 */
      }
      ::-webkit-scrollbar-thumb {
        background: #a1a1aa; /* Zinc-400 */
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #3f3f46; /* Zinc-700 */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #71717a; /* Zinc-500 */
      }
      html,
      body {
        overflow-x: hidden;
        width: 100%;
        height: 100%;
        overflow-y: auto;
      }
      body {
        -webkit-font-smoothing: antialiased; /* Smoother fonts on macOS */
        -moz-osx-font-smoothing: grayscale; /* Smoother fonts on Firefox */
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 transition-colors duration-300"
  >
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
