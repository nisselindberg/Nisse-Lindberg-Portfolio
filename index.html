<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nisse Lindberg | UX Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              lexend: ['Lexend', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#faf5ff',
                100: '#f3e8ff',
                400: '#c084fc',
                500: '#a855f7',
                600: '#9333ea',
                900: '#3b0764',
              },
              dark: {
                DEFAULT: '#020202',
                soft: '#080808',
              }
            },
            animation: {
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <style>
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
      
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        background: #020202;
        color: white;
      }

      /* AI Futuristiskt brus för djup - något tydligare nu */
      .noise-bg {
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.08;
        pointer-events: none;
        z-index: 50;
      }

      .gradient-mesh {
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
        z-index: -1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body class="bg-dark text-zinc-100">
    <div class="noise-bg"></div>
    <div class="gradient-mesh"></div>
    <div id="root"></div>
  </body>
</html>
